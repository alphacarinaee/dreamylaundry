<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreamy Laundry POS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F9F9FF;--sf:#fff;--s2:#E8EFFF;--pri:#00629D;--tx:#1A1C1E;--mu:#42474E;--bd:#DCE6F7;--ok:#10B981;--bad:#EF4444;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;min-height:44px;border-radius:12px;padding:0 14px;background:var(--s2);font-weight:600}
button.on,button.p{background:var(--pri);color:#fff}button:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--s2)}
textarea{padding:10px 12px;resize:none}
#app{display:flex;height:100%}
aside{width:240px;background:var(--sf);border-right:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.logo{font-weight:800;color:var(--pri);font-size:17px;padding-bottom:14px;border-bottom:1px solid var(--bd);margin-bottom:10px}
aside button{background:none;text-align:left;min-height:48px;display:flex;justify-content:space-between;align-items:center}
aside button.on{background:var(--pri)}
.tag{font-size:11px;background:var(--s2);color:var(--mu);border-radius:99px;padding:3px 9px;font-weight:700}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--sf);border-bottom:1px solid var(--bd)}
header h1{font-size:18px;margin:0;flex:1}
#view{flex:1;overflow:auto;padding:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:0 4px 18px rgba(0,98,157,.07)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px}.b{justify-content:space-between}.w{flex-wrap:wrap}
h2{font-size:15px;margin:0 0 10px}.mu{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.svc{background:var(--s2);text-align:left;height:auto;padding:14px;display:flex;flex-direction:column;gap:4px;font-weight:500;min-height:100px}
.svc b{font-size:15px}.svc .pr{margin-top:auto;font-weight:800;color:var(--pri)}
.wt{font-size:42px;font-weight:800;color:var(--pri);text-align:center;background:var(--s2);border-radius:20px;padding:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--s2);border-radius:12px;margin-bottom:8px}
.tot{font-size:30px;font-weight:800;color:var(--pri)}
.res{border:1px solid var(--bd);border-radius:12px;margin-top:6px;overflow:hidden}
.res button{display:block;width:100%;text-align:left;border-radius:0;background:var(--sf)}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.login{width:100%;max-width:360px;align-self:flex-start;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.ok{background:#DCF7EC;border-radius:16px;padding:16px;text-align:center}
.ok b{font-size:22px;color:var(--ok);display:block;margin:6px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pri);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%}
#toast.s{opacity:1}
@media(max-width:900px){.cols{grid-template-columns:1fr}aside{width:190px}}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API=(window.API_URL||'').replace(/\/$/,'');
const PAY=[['tunai','Tunai'],['qris','QRIS'],['transfer','Transfer'],['nanti','Bayar Nanti']];
const TABS=[['Semua',null],['Kiloan (Kg)','kiloan'],['Satuan (Pcs)','satuan'],['Express','express']];
const S0=()=>({cat:null,cust:null,found:[],cart:[],w:4.5,note:'',disc:0,pay:'tunai',cash:0,done:null,reg:false,busy:false});
let S={user:null,token:null,svcs:[],aromas:[],aroma:null,...S0()};
try{const s=JSON.parse(sessionStorage.getItem('dl')||'null');if(s){S.token=s.token;S.user=s.user}}catch{}
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.i);toast.i=setTimeout(()=>t.className='',3000)}
async function api(p,body){
  let r,d=null;
  try{r=await fetch(API+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:body?JSON.stringify(body):undefined})}
  catch{throw new Error('Tidak bisa terhubung ke server. Cek koneksi atau alamat API.')}
  try{d=await r.json()}catch{}
  if(r.status===401&&S.token&&p!=='/auth/login'){logout();throw new Error('Sesi berakhir, silakan login lagi')}
  if(!r.ok)throw new Error(d?(d.detail?d.error+': '+d.detail.join('; '):d.error):'Gagal ('+r.status+')');
  return d}
function logout(){try{sessionStorage.removeItem('dl')}catch{}S={user:null,token:null,svcs:[],aromas:[],aroma:null,...S0()};render()}
const sub=()=>S.cart.reduce((a,i)=>a+Math.round(i.qty*i.p),0);
const total=()=>Math.round(sub()*(100-S.disc)/100);
function quick(t){const r=[];for(const s of[5000,10000]){const v=Math.ceil(t/s)*s;if(v>t&&!r.includes(v))r.push(v)}r.push(Math.max(100000,Math.ceil(t/100000)*100000));return[...new Set(r)].slice(0,3)}

function render(){S.token?shell():login()}
function login(msg=''){
  $('#app').innerHTML=`<div class="login card"><div class="logo" style="border:0">Dreamy Laundry <span class="tag">POS</span><div class="mu">Bersih • Rapi • Wangi</div></div>
  <input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password">
  <button class="p" data-a="login">Masuk</button><div class="err" id="le">${esc(msg)}</div></div>`}
async function doLogin(){
  const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p)return $('#le').textContent='Isi username dan password';
  try{const d=await api('/auth/login',{username:u,password:p});S.token=d.token;S.user=d.user;
    try{sessionStorage.setItem('dl',JSON.stringify({token:d.token,user:d.user}))}catch{}
    await boot()}catch(e){$('#le').textContent=e.message}}
async function boot(){
  try{[S.svcs,S.aromas]=await Promise.all([api('/services'),api('/aromas')]);S.aroma=S.aromas[0]?.id??null}catch(e){toast(e.message)}
  render()}
function shell(){
  const own=S.user.role==='owner';
  const nav=[['Pencatatan Transaksi',''],['Status Pesanan','Sprint 2'],['Riwayat Transaksi','Sprint 2'],...(own?[['Dashboard','Sprint 3'],['Pengaturan Harga','Sprint 3']]:[])];
  $('#app').innerHTML=`<aside><div class="logo">Dreamy Laundry <span class="tag">POS</span></div>
  ${nav.map((n,i)=>`<button class="${i?'':'on'}" ${i?'disabled':''}>${n[0]}${n[1]?`<span class="tag">${n[1]}</span>`:''}</button>`).join('')}</aside>
  <main><header><h1>Pencatatan Transaksi</h1><span class="tag">${esc(S.user.name)} (${esc(S.user.role)})</span><button data-a="logout">Keluar</button></header><div id="view"></div></main>`;
  kasir()}
function kasir(){
  $('#view').innerHTML=`<div class="cols"><div class="stack">
  <div class="card" id="cust"></div>
  <div class="card"><div class="row b w"><h2>Layanan</h2><div class="row w">${TABS.map(t=>`<button class="${S.cat===t[1]?'on':''}" data-cat="${t[1]??''}">${t[0]}</button>`).join('')}</div></div>
   <div class="grid">${S.svcs.filter(s=>!S.cat||s.category===S.cat).map(s=>`<button class="svc" data-add="${s.id}"><b>${esc(s.name)}</b><span class="mu">${esc(s.description||'')}</span><span class="pr">${rp(s.price)}/${s.unit}</span></button>`).join('')||'<p class="mu">Layanan belum tersedia.</p>'}</div></div>
  <div class="card"><h2>Timbangan dan aroma</h2><div class="wt"><span id="wv">${S.w.toFixed(2)}</span> kg</div>
   <div class="g4">${[-.5,.5,1,5].map(d=>`<button data-w="${d}">${d>0?'+':''}${d.toFixed(1)}</button>`).join('')}</div>
   <button data-w="r" style="margin:8px 0">Reset</button>
   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${S.aromas.map(a=>`<button class="${S.aroma===a.id?'on':''}" data-ar="${a.id}">${esc(a.name)}</button>`).join('')}</div>
   <h2 style="margin-top:14px">Catatan khusus cucian</h2><textarea id="nt" rows="2" placeholder="Contoh: noda tinta di kemeja putih">${esc(S.note)}</textarea></div>
  </div><div class="card" id="nota"></div></div>`;
  rCust();rNota()}
function rCust(){
  const c=S.cust,el=$('#cust');
  if(c){el.innerHTML=`<div class="row b"><div><h2 style="margin:0">${esc(c.name)} <span class="tag">${esc(c.member_tier)}</span></h2><span class="mu">${esc(c.phone)} • ${esc(c.address||'-')}</span></div><button data-a="chg">Ganti</button></div>`;return}
  el.innerHTML=`<div class="row b"><h2>Pelanggan</h2><button class="p" data-a="reg">+ Pelanggan Baru</button></div>
  ${S.reg?`<div class="stack" style="gap:8px"><input id="rn" placeholder="Nama lengkap"><input id="rh" placeholder="No. HP / WhatsApp (10-16 digit)" inputmode="tel"><input id="ra" placeholder="Alamat singkat">
   <div class="row"><button class="p" data-a="regsave">Simpan dan pilih</button><button data-a="reg">Batal</button></div><div class="err" id="re"></div></div>`
  :`<input id="cs" placeholder="Cari nama atau nomor HP" autocomplete="off"><div id="cr"></div>`}`}
function rNota(){
  const t=total(),ch=S.cash-t,el=$('#nota');
  if(S.done){const o=S.done;el.innerHTML=`<div class="ok">Nota tersimpan<b>#${esc(o.order_no)}</b><div>${esc(o.customer_name)} • ${rp(o.total)}</div><div class="mu">${o.paid?'Lunas'+(o.change_amount?' • kembalian '+rp(o.change_amount):''):'Belum lunas (bayar saat ambil)'}</div></div>
   <button class="p" data-a="new" style="width:100%;margin-top:12px">Transaksi Baru</button>`;return}
  el.innerHTML=`<div class="mu">NOTA TRANSAKSI KASIR</div>
  ${S.cart.length?S.cart.map((i,x)=>`<div class="line"><span><b>${esc(i.n)}</b><br><span class="mu">${i.qty} ${i.u} × ${rp(i.p)}</span></span><span class="row"><b>${rp(i.qty*i.p)}</b><button data-del="${x}" aria-label="Hapus">✕</button></span></div>`).join(''):'<p class="mu">Belum ada layanan. Pilih layanan di sebelah kiri.</p>'}
  <div class="line"><span>Subtotal</span><b>${rp(sub())}</b></div>
  <div class="row b" style="margin-bottom:8px"><span>Diskon</span><select id="dc" style="width:100px">${[0,5,10].map(d=>`<option value="${d}" ${S.disc==d?'selected':''}>${d}%</option>`).join('')}</select></div>
  <div class="mu">TOTAL TAGIHAN</div><div class="tot">${rp(t)}</div>
  <h2 style="margin-top:12px">Metode pembayaran</h2><div class="g4">${PAY.map(m=>`<button class="${S.pay===m[0]?'on':''}" data-pm="${m[0]}" style="padding:0 4px">${m[1]}</button>`).join('')}</div>
  ${S.pay==='tunai'?`<div class="line" style="display:block;margin-top:10px"><div class="row b"><span>Uang diterima</span><input id="cash" type="number" inputmode="numeric" value="${S.cash||''}" style="width:140px;text-align:right"></div>
   <div class="g4"><button data-c="${t}">Pas</button>${quick(t).map(v=>`<button data-c="${v}">${v/1000}k</button>`).join('')}</div>
   <div class="row b" style="margin-top:10px"><span>Kembalian</span><b id="kb" style="color:${ch<0?'var(--bad)':'var(--pri)'}">${rp(Math.max(ch,0))}</b></div></div>`
   :`<p class="mu">${S.pay==='nanti'?'Tagihan dibayar saat cucian diambil.':'Pastikan pembayaran sudah diterima sebelum menyimpan.'}</p>`}
  <button class="p" data-a="save" style="width:100%;margin-top:12px" ${S.busy?'disabled':''}>${S.busy?'Menyimpan...':'Simpan Transaksi'}</button><div class="err" id="se"></div>`}
async function save(){
  const e=m=>($('#se').textContent=m,false);
  if(!S.cust)return e('Pilih atau daftarkan pelanggan dulu');
  if(!S.cart.length)return e('Tambahkan layanan dulu');
  const t=total();if(S.pay==='tunai'&&S.cash<t)return e('Uang diterima kurang dari total tagihan');
  S.busy=true;rNota();
  try{S.done=await api('/orders',{customer_id:S.cust.id,aroma_id:S.aroma,note:S.note||undefined,discount_pct:S.disc,payment_method:S.pay,paid_amount:S.pay==='tunai'?S.cash:0,items:S.cart.map(i=>({service_id:i.id,qty:i.qty}))})}
  catch(x){S.busy=false;rNota();return e(x.message)}
  S.busy=false;rNota();toast('Nota '+S.done.order_no+' tersimpan')}
async function regSave(){
  const e=m=>$('#re').textContent=m,n=$('#rn').value.trim(),h=$('#rh').value.trim(),a=$('#ra').value.trim();
  if(n.length<2)return e('Nama minimal 2 huruf');if(!/^[0-9+ -]{10,16}$/.test(h))return e('Nomor HP tidak valid (10-16 digit)');
  try{S.cust=await api('/customers',{name:n,phone:h,address:a||undefined});S.reg=false;rCust()}catch(x){e(x.message)}}
function addSvc(id){const s=S.svcs.find(x=>x.id==id);if(S.done)return;
  if(s.unit==='kg'&&S.w<=0)return toast('Timbang cucian dulu');
  const q=s.unit==='kg'?S.w:1,x=S.cart.find(i=>i.id===s.id);
  if(x)x.qty=s.unit==='pcs'?x.qty+1:q;else S.cart.push({id:s.id,n:s.name,u:s.unit,p:s.price,qty:q});rNota()}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.a==='login')doLogin();else if(d.a==='logout')logout();
  else if(d.a==='chg'){S.cust=null;rCust()}else if(d.a==='reg'){S.reg=!S.reg;rCust()}
  else if(d.a==='regsave')regSave();else if(d.a==='save')save();
  else if(d.a==='new'){Object.assign(S,S0());kasir()}
  else if(d.cat!==undefined){S.cat=d.cat||null;kasir()}
  else if(d.add)addSvc(d.add);
  else if(d.w){S.w=d.w==='r'?0:Math.max(0,Math.round((S.w+ +d.w)*100)/100);$('#wv').textContent=S.w.toFixed(2)}
  else if(d.ar){S.aroma=+d.ar;document.querySelectorAll('[data-ar]').forEach(x=>x.className=x.dataset.ar==d.ar?'on':'')}
  else if(d.del){S.cart.splice(+d.del,1);rNota()}
  else if(d.pm){S.pay=d.pm;rNota()}
  else if(d.c){S.cash=+d.c;rNota()}
  else if(d.pick!==undefined){S.cust=S.found[+d.pick];rCust()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lu'||e.target.id==='lp'))doLogin()});
document.addEventListener('change',e=>{if(e.target.id==='dc'){S.disc=+e.target.value;rNota()}});
let tm;document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='cs'){clearTimeout(tm);const q=t.value.trim();tm=setTimeout(async()=>{
    if(!q){$('#cr').innerHTML='';return}
    try{S.found=await api('/customers?q='+encodeURIComponent(q));$('#cr').innerHTML=`<div class="res">${S.found.map((c,i)=>`<button data-pick="${i}">${esc(c.name)} • ${esc(c.phone)}</button>`).join('')||'<button disabled>Tidak ditemukan. Pakai + Pelanggan Baru</button>'}</div>`}catch(x){toast(x.message)}},250)}
  else if(t.id==='cash'){S.cash=+t.value;const c=S.cash-total(),k=$('#kb');k.textContent=rp(Math.max(c,0));k.style.color=c<0?'var(--bad)':'var(--pri)'}
  else if(t.id==='nt')S.note=t.value});
S.token?boot():render();
</script></body></html>
