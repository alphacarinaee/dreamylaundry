<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreamy Laundry POS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F3F6FB;--sf:#FFFFFF;--s2:#F8FAFC;--tint:#EFF6FF;--pri:#00629D;--acc:#1E88E5;--tx:#0F172A;--mu:#64748B;--bd:#E2E8F0;--bd2:#CBD5E1;--ok:#059669;--bad:#DC2626;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);min-height:42px;border-radius:10px;padding:0 14px;background:var(--sf);font-weight:600;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
button:hover:not(:disabled){background:var(--s2);border-color:var(--bd2)}
button:active:not(:disabled){transform:translateY(1px)}
button.on,button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button.on:hover:not(:disabled),button.p:hover:not(:disabled){background:#005385;border-color:#005385}
button.p{background:linear-gradient(135deg,#00629D,#1E88E5);box-shadow:0 4px 12px rgba(0,98,157,.22)}
button:disabled{opacity:.48;cursor:not-allowed}
input,select,textarea{width:100%;min-height:42px;padding:0 12px;border:1px solid var(--bd2);border-radius:10px;background:var(--sf);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(30,136,229,.14)}
textarea{padding:10px 12px;resize:vertical}
#app{display:flex;height:100%}
aside{width:248px;background:var(--sf);border-right:1px solid var(--bd);padding:18px 14px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--tx);font-size:16px;padding:2px 6px 16px;border-bottom:1px solid var(--bd);margin-bottom:10px;letter-spacing:-.01em}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#00629D,#1E88E5);color:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:0 3px 10px rgba(0,98,157,.22)}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--mu);margin-top:1px}
aside button{background:transparent;border-color:transparent;text-align:left;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px;color:var(--mu)}
aside button:hover:not(:disabled){background:var(--s2);border-color:transparent;color:var(--tx)}
aside button.on{background:var(--tint);border-color:#BFDBFE;color:var(--pri);font-weight:700}
aside button .nav-l{display:flex;align-items:center;gap:9px;min-width:0}
.tag{font-size:11px;background:var(--s2);border:1px solid var(--bd);color:var(--mu);border-radius:99px;padding:3px 9px;font-weight:700}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--sf);border-bottom:1px solid var(--bd)}
header h1{font-size:18px;font-weight:800;margin:0;flex:1;letter-spacing:-.01em}
.upill{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 5px;background:var(--s2);border:1px solid var(--bd);border-radius:99px;font-size:12px;font-weight:600}
.uav{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px}
#view{flex:1;overflow:auto;padding:20px 24px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.04),0 6px 16px rgba(15,23,42,.03)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px}.b{justify-content:space-between}.w{flex-wrap:wrap}
h2{font-size:15px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}.mu{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.svc{background:var(--sf);border:1px solid var(--bd);text-align:left;height:auto;padding:14px;display:flex;flex-direction:column;gap:6px;font-weight:500;min-height:112px;border-radius:12px;position:relative}
.svc:hover{border-color:#93C5FD;background:#FAFCFF;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,98,157,.08)}
.svc.in{border-color:var(--acc);background:var(--tint);box-shadow:0 0 0 1px rgba(30,136,229,.2)}
.svc b{font-size:14px;line-height:1.3}.svc .pr{margin-top:auto;padding-top:6px;font-weight:800;color:var(--pri);font-size:14px}
.wt{font-size:40px;font-weight:800;color:var(--pri);text-align:center;background:linear-gradient(180deg,#F8FAFC,#EFF6FF);border:1px solid #BFDBFE;border-radius:14px;padding:10px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
.dash{border-top:1.5px dashed var(--bd2);margin:12px 0;padding-top:12px}
.tot{font-size:30px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.res{border:1px solid var(--bd2);border-radius:10px;margin-top:6px;overflow:hidden;box-shadow:0 6px 18px rgba(15,23,42,.08);max-height:240px;overflow-y:auto}
.res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:var(--sf)}
.res button:last-child{border-bottom:0}
.err{color:var(--bad);font-size:13px;margin-top:8px;font-weight:600}
.login-wrap{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,#DBEAFE 0%,var(--bg) 52%)}
.login{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;padding:24px}
.ok{background:#ECFDF5;border:1px solid #A7F3D0;border-radius:14px;padding:16px;text-align:center}
.ok b{font-size:22px;color:var(--ok);display:block;margin:6px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;box-shadow:0 8px 24px rgba(15,23,42,.22)}
#toast.s{opacity:1}
.ord{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);min-height:0;height:auto;padding:12px 14px;margin-bottom:8px;font-weight:500;border-radius:12px}
.ord.sel{border-color:var(--acc);background:var(--tint);box-shadow:0 0 0 1px rgba(30,136,229,.18)}.ord .r{text-align:right}
.bd{font-size:11px;border-radius:99px;padding:3px 9px;font-weight:700;white-space:nowrap}
.bd.ok{background:#DCFCE7;color:#15803D}.bd.no{background:#FEE2E2;color:#B91C1C}.bd.st{background:#E0F2FE;color:#0369A1}
.flt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.flt label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px;font-weight:600}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi div{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px}.kpi b{display:block;font-size:17px;color:var(--pri);margin-top:2px;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.kcol{background:#EAF0F8;border:1px solid var(--bd);border-radius:14px;padding:10px;min-width:0}
.kcol>h2{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:2px 4px 10px;font-size:14px}
.kc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.kg button{padding:0 4px}.kg button:not(.on){background:var(--sf)}
.bd.ex{background:#FEF3C7;color:#92400E}.kc.ex{border-left:5px solid #F59E0B}.ord.ex{border-left:5px solid #F59E0B}
.kc.late{border-color:var(--bad);border-width:2px}.kc label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.print-only{display:none}
@media(max-width:1100px){.board{grid-template-columns:repeat(4,260px)}}
@media(max-width:900px){.cols{grid-template-columns:1fr}aside{width:200px}#view{padding:14px}}
@media print{
  body{background:#fff}
  #app{display:none!important}
  .print-only{display:block!important;max-width:340px;margin:0 auto;font-family:monospace;font-size:12px;line-height:1.5;color:#000}
  .print-only h2{text-align:center;margin:0 0 2px;font-size:16px}
  .print-only hr{border:0;border-top:1px dashed #000;margin:8px 0}
  .print-only .pr-r{display:flex;justify-content:space-between;gap:8px}
}
</style></head>
<body><div id="app"></div><div id="toast"></div><div id="print-area" class="print-only"></div>
<script src="config.js"></script>
<script src="config.local.js"></script><!-- opsional, tidak di-commit: pengaturan lokal tiap developer -->
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const API=(window.API_URL||'').replace(/\/$/,'');
const DEMO=window.DEMO===true;
const M={users:{rina:{id:1,name:'Rina Oktaviani',role:'kasir'},owner:{id:2,name:'Owner Dreamy Laundry',role:'owner'}},
 svcs:[['Cuci Komplit Reguler','Cuci, kering, setrika, 2 hari','kiloan','kg',7000],['Setrika Saja','Setrika uap rapi wangi','kiloan','kg',5000],['Cuci Kering Lipat','Tanpa setrika, langsung dilipat','kiloan','kg',6000],['Express 6 Jam','Prioritas cuci kering setrika','express','kg',12000],['Bed Cover King','Plastik vakum','satuan','pcs',30000],['Jas Formal / Blazer','Dry cleaning + hanger','satuan','pcs',35000]].map((a,i)=>({id:i+1,name:a[0],description:a[1],category:a[2],unit:a[3],price:a[4]})),
 aromas:['Ocean Fresh','Lavender Dream','Soft Floral','Sakura Blossom'].map((name,i)=>({id:i+1,name})),
 cust:[['Ibu Siti Rahmawati','0812-9843-1120','Jl. Melati No. 4B','Reguler'],['Ibu Siska Amelia','0813-8899-7711','Jl. Kenanga 12','Gold'],['Mba Anisa Rahma','0877-2233-4455','Perum Asri B-7','Reguler'],['Pak Bagus Wicaksono','0811-9876-5432','Jl. Mawar 3','Silver']].map((a,i)=>({id:i+1,name:a[0],phone:a[1],address:a[2],member_tier:a[3]})),n:0,orders:[]};
function mock(p,b){
  const bad=m=>{throw new Error(m)};
  if(p==='/auth/login'){const u=M.users[b.username];if(!u||b.password!=='demo123')bad('Username atau password salah');return{token:'demo',user:u}}
  if(p==='/services')return M.svcs;
  if(p==='/aromas')return M.aromas;
  if(p.startsWith('/customers')){
    if(b){if(!/^[0-9+ -]{10,16}$/.test(b.phone))bad('Input tidak valid: phone: Nomor HP tidak valid');
      if(M.cust.some(c=>c.phone===b.phone))bad('Data sudah ada (nomor HP duplikat?)');
      const c={id:M.cust.length+1,name:b.name,phone:b.phone,address:b.address||null,member_tier:'Reguler'};M.cust.push(c);return c}
    const q=decodeURIComponent(p.split('q=')[1]||'').toLowerCase();
    return M.cust.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q)).slice(0,20)}
  if(p==='/orders'&&b){
    const items=b.items.map(i=>{const s=M.svcs.find(x=>x.id===i.service_id);return{name:s.name,qty:i.qty,unit:s.unit,unit_price:s.price,line_total:Math.round(i.qty*s.price),category:s.category}});
    const sb=items.reduce((a,i)=>a+i.line_total,0);
    const t=Math.round(sb*(100-b.discount_pct)/100),paid=b.payment_method!=='nanti';
    if(b.payment_method==='tunai'&&b.paid_amount<t)bad('Uang diterima kurang dari total tagihan');
    if(b.fulfillment==='antar'&&(b.delivery_address||'').trim().length<5)bad('Alamat pengantaran wajib diisi (minimal 5 karakter)');
    const d=new Date(),y=String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    const c=M.cust.find(c=>c.id===b.customer_id),pa=!paid?0:b.payment_method==='tunai'?b.paid_amount:t;
    const o={id:++M.n,order_no:'DL-'+y+'-'+String(M.n).padStart(4,'0'),status:'antrian',created_at:d.toISOString(),est_ready_at:new Date(+d+48*36e5).toISOString(),
      customer_name:c.name,customer_phone:c.phone,cashier:S.user.name,aroma:(M.aromas.find(a=>a.id===b.aroma_id)||{}).name||null,note:b.note||null,
      items,subtotal:sb,discount_pct:b.discount_pct,total:t,payment_method:b.payment_method,paid,paid_amount:pa,paid_at:paid?d.toISOString():null,change_amount:Math.max(pa-t,0),
      fulfillment:b.fulfillment||'ambil',delivery_address:b.fulfillment==='antar'?b.delivery_address:null,garment_count:b.garment_count||null};
    M.orders.unshift(o);return o}
  if(p.startsWith('/orders?')){
    const q=new URLSearchParams(p.split('?')[1]),day=s=>new Date(s).toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}),k=(q.get('q')||'').toLowerCase();
    const r=M.orders.filter(o=>(!q.get('status')||o.status===q.get('status'))&&(!q.get('paid')||String(o.paid)===q.get('paid'))
      &&(!k||o.order_no.toLowerCase().includes(k)||o.customer_name.toLowerCase().includes(k)||o.customer_phone.includes(k))
      &&(!q.get('from')||day(o.created_at)>=q.get('from'))&&(!q.get('to')||day(o.created_at)<=q.get('to')));
    const off=+(q.get('offset')||0);return r.slice(off,off+ +(q.get('limit')||50))}
  const ms=p.match(/^\/orders\/(\d+)\/status$/);
  if(ms){const o=M.orders.find(x=>x.id===+ms[1]),K=Object.keys(STS);if(!o)bad('Pesanan tidak ditemukan');
    if(K.indexOf(b.status)!==K.indexOf(o.status)+1)bad(`Status harus maju satu tahap dari "${o.status}"`);
    if(b.status==='proses'&&!b.garment_count&&!o.garment_count)bad('Isi jumlah pakaian sebelum mulai proses');if(b.garment_count)o.garment_count=b.garment_count;
    if(b.status==='diambil'&&!o.paid){if(!b.payment)bad(`Pesanan ${o.order_no} belum lunas, tidak bisa diserahkan`);
      const amt=b.payment.method==='tunai'?b.payment.paid_amount:o.total;if(amt<o.total)bad('Uang diterima kurang dari total tagihan');
      Object.assign(o,{paid:true,payment_method:b.payment.method,paid_amount:amt,paid_at:new Date().toISOString(),change_amount:Math.max(amt-o.total,0)})}
    o.status=b.status;if(b.shelf_code)o.shelf_code=b.shelf_code;if(b.status==='diambil')o.picked_up_at=new Date().toISOString();return o}
  bad('Endpoint belum tersedia di mode demo')}
const PAY=[['tunai','Tunai'],['qris','QRIS'],['transfer','Transfer'],['nanti','Bayar Nanti']];
const TABS=[['Semua',null],['Kiloan (Kg)','kiloan'],['Satuan (Pcs)','satuan'],['Express','express']];
const S0=()=>({cat:null,cust:null,found:[],cart:[],w:4.5,note:'',disc:0,pay:'tunai',cash:0,done:null,reg:false,busy:false,ful:'ambil',addr:''});
let S={user:null,token:null,svcs:[],aromas:[],aroma:null,page:'kasir',...S0()};
const ymd=(d=new Date())=>d.toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'});
const R0=()=>({f:{q:'',from:ymd(),to:ymd(),paid:'',status:''},list:[],sel:null,more:false,busy:false,err:''});
let R=R0();
const K0=()=>({q:'',cols:{antrian:[],proses:[],siap:[],diambil:[]},busy:false,err:'',act:null,pm:'tunai',cash:0,pcs:0,saving:false,seq:0});
let K=K0();
const LIM=50,STS={antrian:'Antrian',proses:'Proses',siap:'Siap Diambil',diambil:'Sudah Diambil'};
const FUL=[['ambil','Ambil Sendiri'],['antar','Delivery']],dlv=o=>o.fulfillment==='antar';
const exp=o=>o.items.some(i=>i.category==='express');
const pcs=o=>o.garment_count?o.garment_count+' potong':'';
const stl=(o,s=o.status)=>dlv(o)&&s==='siap'?'Siap Diantar':dlv(o)&&s==='diambil'?'Sudah Diantar':STS[s]||s;
const tgl=s=>new Date(s).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
try{const s=JSON.parse(sessionStorage.getItem('dl')||'null');if(s){S.token=s.token;S.user=s.user}}catch{}
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.i);toast.i=setTimeout(()=>t.className='',3000)}
async function api(p,body,method){
  if(DEMO){await new Promise(r=>setTimeout(r,120));return mock(p,body)}
  let r,d=null;
  try{r=await fetch(API+p,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:body?JSON.stringify(body):undefined})}
  catch{throw new Error('Tidak bisa terhubung ke server. Cek koneksi atau alamat API.')}
  try{d=await r.json()}catch{}
  if(r.status===401&&S.token&&p!=='/auth/login'){logout();throw new Error('Sesi berakhir, silakan login lagi')}
  if(!r.ok)throw new Error(d?(d.detail?d.error+': '+d.detail.join('; '):d.error):'Gagal ('+r.status+')');
  return d}
function logout(){try{sessionStorage.removeItem('dl')}catch{}S={user:null,token:null,svcs:[],aromas:[],aroma:null,page:'kasir',...S0()};R=R0();K=K0();render()}
const sub=()=>S.cart.reduce((a,i)=>a+Math.round(i.qty*i.p),0);
const total=()=>Math.round(sub()*(100-S.disc)/100);
function quick(t){const r=[];for(const s of[5000,10000]){const v=Math.ceil(t/s)*s;if(v>t&&!r.includes(v))r.push(v)}r.push(Math.max(100000,Math.ceil(t/100000)*100000));return[...new Set(r)].slice(0,3)}

const LOGO_SVG=`<span class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></span>`;
const ICONS={
  kasir:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 15h0M2 9.5h20"/></svg>',
  status:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="15" rx="1"/></svg>',
  riwayat:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>',
  dash:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-3 3"/></svg>',
  cfg:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'
};
function printReceipt(o){
  if(!o)return;
  const pm=(PAY.find(p=>p[0]===o.payment_method)||[,o.payment_method])[1];
  $('#print-area').innerHTML=`<h2>DREAMY LAUNDRY</h2><div style="text-align:center">Bersih • Rapi • Wangi</div><hr>
  <div class="pr-r"><span>No. Nota</span><b>${esc(o.order_no)}</b></div>

function render(){S.token?shell():login()}
function login(msg=''){

async function doLogin(){
  const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p)return $('#le').textContent='Isi username dan password';
  try{const d=await api('/auth/login',{username:u,password:p});S.token=d.token;S.user=d.user;
    try{sessionStorage.setItem('dl',JSON.stringify({token:d.token,user:d.user}))}catch{}
    await boot()}catch(e){$('#le').textContent=e.message}}
async function boot(){
  try{[S.svcs,S.aromas]=await Promise.all([api('/services'),api('/aromas')]);S.aroma=S.aromas[0]?.id??null}catch(e){toast(e.message)}
  render()}
function shell(){
  const own=S.user.role==='owner';
  const nav=[['Pencatatan Transaksi','','kasir','kasir'],['Status Pesanan','','status','status'],['Riwayat Transaksi','','riwayat','riwayat'],...(own?[['Dashboard','Sprint 3','','dash'],['Pengaturan Harga','Sprint 3','','cfg']]:[])];

  ${nav.map(n=>`<button class="${n[2]===S.page?'on':''}" ${n[2]?`data-nav="${n[2]}"`:'disabled'}><span class="nav-l">${ICONS[n[3]]||''}<span>${n[0]}</span></span>${n[1]?`<span class="tag">${n[1]}</span>`:''}</button>`).join('')}</aside>
  <main><header><h1>${cur[0]}</h1>${DEMO?'<span class="tag">MODE DEMO</span>':''}<div class="upill"><span class="uav">${esc((S.user.name||'U')[0].toUpperCase())}</span><span>${esc(S.user.name)} (${esc(S.user.role)})</span></div><button data-a="logout">Keluar</button></header><div id="view"></div></main>`;

// ---- Status Pesanan (Kanban) ----
const NEXT={antrian:['proses','Mulai Proses'],proses:['siap','Tandai Siap'],siap:['diambil','Serahkan']};
function statusPage(){
  $('#view').innerHTML=`<div class="stack"><div class="card row w"><input id="kq" placeholder="Cari nomor nota, nama, atau nomor HP" value="${esc(K.q)}" autocomplete="off" style="flex:1;min-width:220px"><button data-a="kreload">Muat ulang</button></div><div id="board"></div></div>`;
  loadK()}
async function loadK(){
  const my=++K.seq,t=ymd();K.busy=true;K.err='';rBoard();
  try{const r=await Promise.all(Object.keys(STS).map(s=>api('/orders?'+new URLSearchParams({status:s,limit:200}))));
    if(my!==K.seq)return;Object.keys(STS).forEach((s,i)=>K.cols[s]=s==='diambil'?r[i].filter(o=>o.picked_up_at&&ymd(new Date(o.picked_up_at))===t):r[i])}
  catch(e){if(my!==K.seq)return;K.err=e.message}
  K.busy=false;rBoard()}
const kFind=id=>Object.values(K.cols).flat().find(o=>o.id===id);
function rBoard(){
  const el=$('#board');if(!el)return;const all=Object.values(K.cols).flat();
  if(K.err&&!all.length){el.innerHTML=`<div class="card"><p class="err">${esc(K.err)}</p><button data-a="kreload">Coba lagi</button></div>`;return}
  const q=K.q.toLowerCase(),hit=o=>!q||o.order_no.toLowerCase().includes(q)||o.customer_name.toLowerCase().includes(q)||(o.customer_phone||'').includes(q);
  el.innerHTML=(K.err?`<p class="err">${esc(K.err)}</p>`:'')+`<div class="board">${Object.entries(STS).map(([s,label])=>{
    let L=K.cols[s].filter(hit);if(s!=='diambil')L=[...L].sort((a,b)=>new Date(a.est_ready_at)-new Date(b.est_ready_at));
    return `<div class="kcol" data-col="${s}"><h2><span>${{siap:'Siap',diambil:'Selesai'}[s]||label}${s==='diambil'?' <span class="mu">hari ini</span>':''}</span><span class="tag">${L.length}</span></h2>
    ${K.busy&&!all.length?'<p class="mu" style="padding:0 4px">Memuat...</p>':L.map(kCard).join('')||'<p class="mu" style="padding:0 4px">Kosong</p>'}</div>`}).join('')}</div>`}
function kCard(o){
  const late=['antrian','proses'].includes(o.status)&&o.est_ready_at&&new Date(o.est_ready_at)<Date.now(),nx=NEXT[o.status];
  return `<div class="kc ${late?'late':''} ${exp(o)?'ex':''}" data-card="${o.id}">${exp(o)?'<span class="bd ex" style="align-self:flex-start">EXPRESS</span>':''}<div class="row b"><b style="white-space:nowrap">${esc(o.order_no)}</b><span class="bd ${o.paid?'ok':'no'}">${o.paid?'Lunas':'Belum lunas'}</span></div>
  <div><b>${esc(o.customer_name)}</b> <span class="mu">${esc(o.customer_phone||'')}</span></div>
  ${dlv(o)?`<div class="row" style="align-items:flex-start"><span class="bd st">Delivery</span><span class="mu">${esc(o.delivery_address)}</span></div>`:''}
  <div class="mu">${esc(o.items.map(i=>i.name+' '+(+i.qty).toLocaleString('id-ID')+' '+i.unit).join(', '))} • ${rp(o.total)}</div>
  ${o.garment_count?`<div><b>${pcs(o)}</b></div>`:''}
  <div class="mu">${o.status==='diambil'?(dlv(o)?'Diantar ':'Diambil ')+tgl(o.picked_up_at):(late?'<b style="color:var(--bad)">Terlambat</b> • ':'')+'Estimasi '+tgl(o.est_ready_at)}${o.shelf_code?' • Rak '+esc(o.shelf_code):''}</div>
  ${o.note?`<div class="mu">Catatan: ${esc(o.note)}</div>`:''}
  ${!nx?'':K.act===o.id&&(o.status==='siap'||o.status==='antrian')?kForm(o):`<button class="p" data-ka="${o.id}" ${K.saving?'disabled':''}>${K.saving&&K.act===o.id?'Menyimpan...':o.status==='siap'&&dlv(o)?'Tandai Terkirim':nx[1]}</button>`}</div>`}
function kForm(o){
  const btn=t=>`<div class="row"><button class="p" data-a="kok" style="flex:1" ${K.saving?'disabled':''}>${K.saving?'Menyimpan...':t}</button><button data-a="kcancel">Batal</button></div><div class="err" id="ke"></div>`;
  if(o.status==='antrian')return `<div><div class="mu" style="margin-bottom:4px">Hitung pakaian saat memilah, lalu isi jumlahnya.</div>
   <input id="kpc" type="number" inputmode="numeric" min="1" max="999" value="${K.pcs||''}" placeholder="Jumlah potong" aria-label="Jumlah pakaian" style="text-align:center;font-size:20px;font-weight:800;color:var(--pri)"></div>${btn('Simpan dan Mulai Proses')}`;
  const cek=o.garment_count?` Cocokkan jumlah: <b>${pcs(o)}</b>.`:'';
  if(o.paid)return dlv(o)?`<div class="mu">Pastikan cucian sudah diterima pelanggan, lalu konfirmasi.${cek}</div>${btn('Konfirmasi Terkirim')}`:`<div class="mu">Serahkan cucian ke pelanggan, lalu konfirmasi.${cek}</div>${btn('Konfirmasi Diserahkan')}`;
  const ch=K.cash-o.total;
  return `${o.garment_count?`<div class="mu">Cocokkan jumlah: <b>${pcs(o)}</b></div>`:''}<div class="line" style="display:block;margin:0"><div class="row b"><span>Tagihan</span><b>${rp(o.total)}</b></div>
   <div class="kg">${PAY.filter(m=>m[0]!=='nanti').map(m=>`<button class="${K.pm===m[0]?'on':''}" data-kpm="${m[0]}">${m[1]}</button>`).join('')}</div>
   ${K.pm==='tunai'?`<label style="margin-top:8px">Uang diterima<input id="kc" type="number" inputmode="numeric" value="${K.cash||''}" style="text-align:right;background:var(--sf)"></label>
   <div class="kg" style="grid-template-columns:repeat(4,1fr)"><button data-kq="${o.total}">Pas</button>${quick(o.total).map(v=>`<button data-kq="${v}">${v/1000}k</button>`).join('')}</div>
   <div class="row b" style="margin-top:8px"><span>Kembalian</span><b id="kk" style="color:${ch<0?'var(--bad)':'var(--pri)'}">${rp(Math.max(ch,0))}</b></div>`
   :'<p class="mu" style="margin:8px 0 0">Pastikan pembayaran sudah diterima.</p>'}</div>${btn(dlv(o)?'Lunasi dan Tandai Terkirim':'Lunasi dan Serahkan')}`}
function kOpen(id){
  if(K.saving)return;const o=kFind(id);if(!o)return;
  K.act=id;K.pm='tunai';K.cash=0;K.pcs=o.garment_count||0;
  o.status==='proses'?kSave():(rBoard(),o.status==='antrian'&&$('#kpc')?.focus())}
async function kSave(){
  if(K.saving)return;const o=kFind(K.act);if(!o)return;
  const nx=NEXT[o.status][0],body={status:nx},e=m=>{const x=$('#ke');if(x)x.textContent=m;else toast(m)};
  if(o.status==='antrian'){if(!(K.pcs>=1&&K.pcs<=999))return e('Isi jumlah pakaian (1 sampai 999 potong)');body.garment_count=K.pcs}
  if(o.status==='siap'&&!o.paid){
    if(K.pm==='tunai'&&K.cash<o.total)return e('Uang diterima kurang dari total tagihan');
    body.payment={method:K.pm,paid_amount:K.pm==='tunai'?K.cash:o.total}}
  K.saving=true;rBoard();
  try{const r=await api(`/orders/${o.id}/status`,body,'PATCH');
    K.saving=false;K.act=null;toast(`${o.order_no}: ${stl(o,nx)}${body.payment&&r.change_amount?' • kembalian '+rp(r.change_amount):''}`);await loadK()}
  catch(x){K.saving=false;if(o.status==='proses')K.act=null;rBoard();e(x.message)}}

function riwayat(){
  const f=R.f;
  $('#view').innerHTML=`<div class="cols"><div class="stack">
  <div class="card"><h2 style="margin:0">Filter</h2>
   <input id="fq" placeholder="Cari nomor nota, nama, atau nomor HP" value="${esc(f.q)}" autocomplete="off" style="margin-top:10px">

   <label>Pembayaran<select id="fp">${[['','Semua'],['true','Lunas'],['false','Belum lunas']].map(o=>`<option value="${o[0]}" ${f.paid===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>
   <label>Status<select id="fs"><option value="">Semua</option>${Object.entries(STS).map(([k,v])=>`<option value="${k}" ${f.status===k?'selected':''}>${v}</option>`).join('')}</select></label></div>

  <div class="card"><div id="rlist"></div></div></div>
  <div class="card" id="rdet"></div></div>`;

async function loadR(reset){
  const f=R.f;$('#fe').textContent='';
  if(f.from&&f.to&&f.from>f.to){$('#fe').textContent='Tanggal awal tidak boleh setelah tanggal akhir';return}
  if(reset){R.list=[];R.sel=null}
  const qs=new URLSearchParams({limit:LIM,offset:R.list.length});
  for(const k of['q','from','to','paid','status'])if(f[k])qs.set(k,f[k]);
  const my=R.seq=(R.seq||0)+1;R.busy=true;R.err='';rList();
  try{const d=await api('/orders?'+qs);if(my!==R.seq)return;R.list=R.list.concat(d);R.more=d.length===LIM}catch(e){if(my!==R.seq)return;R.err=e.message}
  R.busy=false;rList();rDet()}
function rList(){
  const el=$('#rlist');if(!el)return;const L=R.list;
  if(R.err&&!L.length){el.innerHTML=`<p class="err">${esc(R.err)}</p><button data-a="rretry">Coba lagi</button>`;return}
  if(R.busy&&!L.length){el.innerHTML='<p class="mu">Memuat transaksi...</p>';return}
  if(!L.length){el.innerHTML='<p class="mu">Tidak ada transaksi pada filter ini.</p>';return}
  const sum=(a,f)=>a.reduce((s,o)=>s+(f(o)?o.total:0),0),un=L.filter(o=>!o.paid);
  el.innerHTML=`<div class="kpi"><div><span class="mu">Transaksi</span><b>${L.length}${R.more?'+':''}</b></div>
   <div><span class="mu">Total nilai</span><b>${rp(sum(L,()=>1))}</b></div>
   <div><span class="mu">Sudah lunas</span><b>${rp(sum(L,o=>o.paid))}</b></div>
   <div><span class="mu">Belum lunas (${un.length})</span><b style="color:${un.length?'var(--bad)':'var(--pri)'}">${rp(sum(un,()=>1))}</b></div></div>
  ${R.more?'<p class="mu" style="margin-top:-4px">Ringkasan dihitung dari transaksi yang sudah dimuat.</p>':''}
  ${L.map((o,i)=>`<button class="ord ${R.sel===i?'sel':''} ${exp(o)?'ex':''}" data-od="${i}">
   <span><b>${esc(o.order_no)}</b> • ${esc(o.customer_name)}</span><b class="r">${rp(o.total)}</b>
   <span class="mu">${tgl(o.created_at)} • ${o.garment_count?pcs(o)+' • ':''}${esc(o.items.map(x=>x.name).join(', '))}</span>
   <span class="row r" style="justify-content:flex-end">${exp(o)?'<span class="bd ex">Express</span>':''}${dlv(o)?'<span class="bd st">Delivery</span>':''}<span class="bd st">${esc(stl(o))}</span><span class="bd ${o.paid?'ok':'no'}">${o.paid?'Lunas':'Belum lunas'}</span></span></button>`).join('')}
  ${R.err?`<p class="err">${esc(R.err)}</p>`:''}
  ${R.more?`<button data-a="rmore" style="width:100%" ${R.busy?'disabled':''}>${R.busy?'Memuat...':'Muat lebih banyak'}</button>`:''}`}
function rDet(){
  const el=$('#rdet');if(!el)return;const o=R.list[R.sel];
  if(!o){el.innerHTML='<div class="mu">DETAIL TRANSAKSI</div><p class="mu">Pilih salah satu transaksi untuk melihat rincian nota.</p>';return}

  <h2 style="font-size:20px;margin:6px 0 2px">${esc(o.order_no)}</h2><div class="mu">${tgl(o.created_at)}${o.cashier?' • kasir '+esc(o.cashier):''}</div>

  ${o.items.map(i=>`<div class="line"><span><b>${esc(i.name)}</b><br><span class="mu">${(+i.qty).toLocaleString('id-ID')} ${esc(i.unit)} × ${rp(i.unit_price)}</span></span><b>${rp(i.line_total)}</b></div>`).join('')}
  <div class="row b" style="padding:4px 2px"><span>Subtotal</span><span>${rp(o.subtotal)}</span></div>
  ${o.discount_pct?`<div class="row b" style="padding:4px 2px"><span>Diskon ${o.discount_pct}%</span><span>- ${rp(o.subtotal-o.total)}</span></div>`:''}
  <div class="row b" style="padding:4px 2px"><b>Total</b><b class="tot" style="font-size:22px">${rp(o.total)}</b></div>
  <div class="line" style="display:block"><div class="row b"><span>Pembayaran</span><span class="bd ${o.paid?'ok':'no'}">${o.paid?'Lunas':'Belum lunas'}</span></div>
   ${o.paid?`<div class="row b mu" style="margin-top:6px"><span>${esc(pm)}${o.paid_at?' • '+tgl(o.paid_at):''}</span><span>${rp(o.paid_amount)}</span></div>

  <button class="p" data-a="rprint" style="width:100%;margin-top:14px">Cetak Struk / PDF</button>`}
function kasir(){

  <div class="card"><div class="row b w" style="margin-bottom:12px"><h2 style="margin:0">Layanan</h2><div class="row w">${TABS.map(t=>`<button class="${S.cat===t[1]?'on':''}" data-cat="${t[1]??''}">${t[0]}</button>`).join('')}</div></div>

function rCust(){
  const c=S.cust,el=$('#cust');
  if(c){el.innerHTML=`<div class="row b"><div><h2 style="margin:0">${esc(c.name)} <span class="tag">${esc(c.member_tier)}</span></h2><span class="mu">${esc(c.phone)} • ${esc(c.address||'-')}</span></div><button data-a="chg">Ganti</button></div>`;return}

  :`<input id="cs" placeholder="Cari nama atau nomor HP" autocomplete="off"><div id="cr"></div>`}`}
function rNota(){
  const t=total(),ch=S.cash-t,el=$('#nota');
  if(S.done){const o=S.done;el.innerHTML=`<div class="ok">Nota tersimpan<b>#${esc(o.order_no)}</b><div>${esc(o.customer_name)} • ${rp(o.total)}</div><div class="mu">${o.paid?'Lunas'+(o.change_amount?' • kembalian '+rp(o.change_amount):''):dlv(o)?'Belum lunas (bayar saat diantar)':'Belum lunas (bayar saat ambil)'}</div>${dlv(o)?`<div class="mu">Delivery: ${esc(o.delivery_address)}</div>`:''}</div>
   <div class="row" style="margin-top:12px"><button data-a="print" style="flex:1">Cetak Struk / PDF</button><button class="p" data-a="new" style="flex:1">Transaksi Baru</button></div>`;return}
  el.innerHTML=`<div class="row b" style="margin-bottom:10px"><div class="mu" style="font-weight:700;letter-spacing:.04em">NOTA TRANSAKSI KASIR</div><span class="tag">${S.cart.length} item</span></div>
  ${S.cart.length?S.cart.map((i,x)=>`<div class="line"><span><b>${esc(i.n)}</b><br><span class="mu">${i.qty} ${i.u} × ${rp(i.p)}</span></span><span class="row"><b>${rp(i.qty*i.p)}</b><button data-del="${x}" aria-label="Hapus" style="min-height:32px;padding:0 10px">✕</button></span></div>`).join(''):'<p class="mu">Belum ada layanan. Pilih layanan di sebelah kiri.</p>'}
  <div class="dash"><div class="row b" style="margin-bottom:8px"><span>Subtotal</span><b>${rp(sub())}</b></div>
  <div class="row b" style="margin-bottom:8px"><span>Diskon</span><select id="dc" style="width:100px">${[0,5,10].map(d=>`<option value="${d}" ${S.disc==d?'selected':''}>${d}%</option>`).join('')}</select></div>
  <div class="mu">TOTAL TAGIHAN</div><div class="tot">${rp(t)}</div></div>
  <h2 style="margin-top:12px">Metode pengambilan</h2><div class="g4" style="grid-template-columns:1fr 1fr">${FUL.map(m=>`<button class="${S.ful===m[0]?'on':''}" data-ful="${m[0]}">${m[1]}</button>`).join('')}</div>
  ${S.ful==='antar'?`<textarea id="da" rows="2" placeholder="Alamat pengantaran lengkap" style="margin-top:8px">${esc(S.addr)}</textarea>`:''}
  <h2 style="margin-top:12px">Metode pembayaran</h2><div class="g4">${PAY.map(m=>`<button class="${S.pay===m[0]?'on':''}" data-pm="${m[0]}" style="padding:0 4px">${m[1]}</button>`).join('')}</div>
  ${S.pay==='tunai'?`<div class="line" style="display:block;margin-top:10px"><div class="row b"><span>Uang diterima</span><input id="cash" type="number" inputmode="numeric" value="${S.cash||''}" style="width:140px;text-align:right"></div>
   <div class="g4"><button data-c="${t}">Pas</button>${quick(t).map(v=>`<button data-c="${v}">${v/1000}k</button>`).join('')}</div>
   <div class="row b" style="margin-top:10px"><span>Kembalian</span><b id="kb" style="color:${ch<0?'var(--bad)':'var(--pri)'}">${rp(Math.max(ch,0))}</b></div></div>`
   :`<p class="mu">${S.pay==='nanti'?(S.ful==='antar'?'Tagihan dibayar saat cucian diantar.':'Tagihan dibayar saat cucian diambil.'):'Pastikan pembayaran sudah diterima sebelum menyimpan.'}</p>`}
  <button class="p" data-a="save" style="width:100%;margin-top:12px" ${S.busy?'disabled':''}>${S.busy?'Menyimpan...':'Simpan Transaksi'}</button><div class="err" id="se"></div>`}
async function save(){
  const e=m=>($('#se').textContent=m,false);
  if(!S.cust)return e('Pilih atau daftarkan pelanggan dulu');
  if(!S.cart.length)return e('Tambahkan layanan dulu');
  if(S.ful==='antar'&&S.addr.trim().length<5)return e('Isi alamat pengantaran (minimal 5 karakter)');
  const t=total();if(S.pay==='tunai'&&S.cash<t)return e('Uang diterima kurang dari total tagihan');
  S.busy=true;rNota();
  try{S.done=await api('/orders',{customer_id:S.cust.id,aroma_id:S.aroma,note:S.note||undefined,discount_pct:S.disc,payment_method:S.pay,paid_amount:S.pay==='tunai'?S.cash:0,fulfillment:S.ful,delivery_address:S.ful==='antar'?S.addr.trim():undefined,items:S.cart.map(i=>({service_id:i.id,qty:i.qty}))})}
  catch(x){S.busy=false;rNota();return e(x.message)}
  S.busy=false;rNota();toast('Nota '+S.done.order_no+' tersimpan')}
async function regSave(){
  const e=m=>$('#re').textContent=m,n=$('#rn').value.trim(),h=$('#rh').value.trim(),a=$('#ra').value.trim();
  if(n.length<2)return e('Nama minimal 2 huruf');if(!/^[0-9+ -]{10,16}$/.test(h))return e('Nomor HP tidak valid (10-16 digit)');
  try{S.cust=await api('/customers',{name:n,phone:h,address:a||undefined});S.reg=false;rCust();if(S.ful==='antar'&&!S.addr&&a){S.addr=a;rNota()}}catch(x){e(x.message)}}
function addSvc(id){const s=S.svcs.find(x=>x.id==id);if(S.done)return;
  if(s.unit==='kg'&&S.w<=0)return toast('Timbang cucian dulu');
  const q=s.unit==='kg'?S.w:1,x=S.cart.find(i=>i.id===s.id);
  if(x)x.qty=s.unit==='pcs'?x.qty+1:q;else S.cart.push({id:s.id,n:s.name,u:s.unit,p:s.price,qty:q});
  kasir()}
async function findCust(q=''){
  const cr=$('#cr');if(!cr)return;
  try{S.found=await api('/customers?q='+encodeURIComponent(q));const cr2=$('#cr');if(!cr2)return;
    cr2.innerHTML=S.found.length?`<div class="res">${S.found.map((c,i)=>`<button data-pick="${i}">${esc(c.name)} • ${esc(c.phone)}</button>`).join('')}</div>`:(q?'<div class="res"><button disabled>Tidak ditemukan. Pakai + Pelanggan Baru</button></div>':'')}catch(x){toast(x.message)}}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.a==='login')doLogin();else if(d.a==='logout')logout();
  else if(d.a==='print')printReceipt(S.done);else if(d.a==='rprint')printReceipt(R.list[R.sel]);
  else if(d.nav){if(d.nav!==S.page){S.page=d.nav;shell()}}
  else if(d.od!==undefined){R.sel=+d.od;document.querySelectorAll('[data-od]').forEach(x=>x.classList.toggle('sel',x===b));rDet();
    if(matchMedia('(max-width:900px)').matches)$('#rdet').scrollIntoView({behavior:'smooth'})}
  else if(d.a==='rmore')loadR(false);else if(d.a==='rretry')loadR(true);
  else if(d.ka)kOpen(+d.ka);else if(d.a==='kok')kSave();else if(d.a==='kreload')loadK();
  else if(d.a==='kcancel'){K.act=null;rBoard()}
  else if(d.kpm){K.pm=d.kpm;rBoard()}else if(d.kq){K.cash=+d.kq;rBoard()}
  else if(d.a==='chg'){S.cust=null;rCust()}else if(d.a==='reg'){S.reg=!S.reg;rCust()}
  else if(d.a==='regsave')regSave();else if(d.a==='save')save();
  else if(d.a==='new'){Object.assign(S,S0());kasir()}
  else if(d.cat!==undefined){S.cat=d.cat||null;kasir()}
  else if(d.add)addSvc(d.add);
  else if(d.w){S.w=d.w==='r'?0:Math.max(0,Math.round((S.w+ +d.w)*100)/100);$('#wv').textContent=S.w.toFixed(2)}
  else if(d.ar){S.aroma=+d.ar;document.querySelectorAll('[data-ar]').forEach(x=>x.className=x.dataset.ar==d.ar?'on':'')}
  else if(d.del){S.cart.splice(+d.del,1);kasir()}
  else if(d.pm){S.pay=d.pm;rNota()}
  else if(d.c){S.cash=+d.c;rNota()}
  else if(d.ful){S.ful=d.ful;if(S.ful==='antar'&&!S.addr&&S.cust?.address)S.addr=S.cust.address;rNota();if(S.ful==='antar')$('#da')?.focus()}
  else if(d.pick!==undefined){S.cust=S.found[+d.pick];rCust();if(S.ful==='antar'&&!S.addr&&S.cust.address){S.addr=S.cust.address;rNota()}}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='lu'||id==='lp')doLogin();else if(id==='kc'||id==='kpc')kSave()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='dc'){S.disc=+t.value;rNota()}
  else if(['ff','ft','fp','fs'].includes(t.id)){R.f[{ff:'from',ft:'to',fp:'paid',fs:'status'}[t.id]]=t.value;loadR(true)}});
document.addEventListener('focusin',e=>{if(e.target.id==='cs'&&!e.target.value.trim())findCust('')});
let tm;document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='cs'){clearTimeout(tm);const q=t.value.trim();tm=setTimeout(()=>findCust(q),250)}
  else if(t.id==='kq'){K.q=t.value.trim();rBoard()}
  else if(t.id==='kpc'){K.pcs=Math.max(0,Math.floor(+t.value||0));$('#ke')&&($('#ke').textContent='')}
  else if(t.id==='kc'){K.cash=+t.value;$('#ke')&&($('#ke').textContent='');const o=kFind(K.act),c=K.cash-(o?o.total:0),k=$('#kk');if(k){k.textContent=rp(Math.max(c,0));k.style.color=c<0?'var(--bad)':'var(--pri)'}}
  else if(t.id==='fq'){clearTimeout(tm);tm=setTimeout(()=>{R.f.q=t.value.trim();loadR(true)},300)}
  else if(t.id==='cash'){S.cash=+t.value;const c=S.cash-total(),k=$('#kb');k.textContent=rp(Math.max(c,0));k.style.color=c<0?'var(--bad)':'var(--pri)'}
  else if(t.id==='nt')S.note=t.value
  else if(t.id==='da')S.addr=t.value});
S.token?boot():render();
</script></body></html>
