services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di file .env}
      POSTGRES_DB: dreamy_laundry
      TZ: Asia/Jakarta
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d dreamy_laundry"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://laundry:${DB_PASSWORD}@db:5432/dreamy_laundry
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      KASIR_PASSWORD: ${KASIR_PASSWORD:-}
    ports: ["3001:3000"]
    restart: unless-stopped
volumes:
  pgdata:
